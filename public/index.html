<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlarZutaten MVP</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#1f2937;background:#f7f7f4}body{margin:0}.wrap{max-width:820px;margin:auto;padding:28px 18px}.brand{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 8px 30px #0000000a}h1{font-size:38px;margin:8px 0}p{line-height:1.5}.row{display:flex;gap:10px}input{flex:1;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:17px}button{padding:14px 18px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#f3f4f6;margin:3px;font-size:13px}.good{background:#dcfce7}.warn{background:#fef3c7}.bad{background:#fee2e2}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:14px;border-radius:12px;font-size:12px}.muted{color:#6b7280;font-size:14px}@media(max-width:600px){h1{font-size:30px}.row{flex-direction:column}}
</style></head><body><main class="wrap"><div class="brand">KlarZutaten · MVP <span id="appVersion">0.4.0</span></div><h1>Was steckt wirklich drin?</h1><p>EAN eingeben. KlarZutaten löst das Produkt über mehrere Quellen auf und erklärt Zucker, Süßungsmittel und Zusatzstoffe.</p><section class="card"><div class="row"><input id="ean" inputmode="numeric" placeholder="z. B. 4031244004895" value="4031244004895"><button id="go">Analysieren</button></div><p class="muted">Backend: Cloudflare Worker · Multi-Source Field Merger · OFF + Rossmann + dm.</p></section><section id="out" class="card" hidden></section></main><script>
const e=document.querySelector('#ean'),b=document.querySelector('#go'),o=document.querySelector('#out');fetch('/api/version').then(r=>r.json()).then(v=>{document.querySelector('#appVersion').textContent=v.version}).catch(()=>{});
function pill(t,c=''){return `<span class="pill ${c}">${t}</span>`}async function run(){const v=e.value.trim();o.hidden=false;o.innerHTML='<p>Produkt wird aufgelöst …</p>';try{const r=await fetch('/api/product/'+encodeURIComponent(v));const d=await r.json();const a=d.analysis||{},p=d.product||{};o.innerHTML=`<h2>${p.name||'Produkt '+v}</h2><p>${p.brand||''}</p><div>${a.added_sugar?pill('Zugesetzter Zucker','bad'):pill('Kein zugesetzter Zucker erkannt','good')} ${a.sweeteners_present?pill('Süßungsmittel','warn'):pill('Keine Süßungsmittel erkannt','good')} ${a.sweetening_ingredients_present?pill('Süßende Zutaten','warn'):''}</div><h3>Zutaten</h3><p>${p.ingredients||'Keine Zutatenliste gefunden.'}</p><h3>Quellen</h3><p>${(d.sources||[]).map(x=>pill(x.source)).join(' ')||'Keine'}</p><details><summary>Technische Antwort</summary><pre>${JSON.stringify(d,null,2)}</pre></details>`}catch(err){o.innerHTML='<p>Fehler: '+err.message+'</p>'}}b.onclick=run;e.addEventListener('keydown',x=>{if(x.key==='Enter')run()});
</script></body></html>
